<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f2330"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </radialGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b39"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.5"/>
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Outer glowing circle to signify flying/theater vibe -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#brand-grad)" stroke-width="4" stroke-dasharray="12,12" opacity="0.6"/>

  <!-- Core Theater / Flying Wing Icon -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <!-- Wings of Flying Theater -->
    <path d="M 12 128 C 40 40, 216 40, 244 128 C 170 128, 140 100, 128 116 C 116 100, 86 128, 12 128 Z" fill="url(#brand-grad)"/>
    <!-- Seats/Theater curve -->
    <path d="M 40 145 C 80 185, 176 185, 216 145" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <!-- Floating particles or motion arches -->
    <path d="M 70 110 A 60 60 0 0 1 186 110" fill="none" stroke="#ff8f5a" stroke-width="6" stroke-linecap="round" stroke-dasharray="6,12" opacity="0.8"/>
  </g>
  
  <!-- Modern clean star in the center -->
  <path d="M 256 180 L 264 205 L 290 205 L 269 220 L 277 245 L 256 230 L 235 245 L 243 220 L 222 205 L 248 205 Z" fill="#ffffff"/>
</svg>
